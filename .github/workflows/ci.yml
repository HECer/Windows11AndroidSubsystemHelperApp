name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test tests/WsaHelper.Tests/WsaHelper.Tests.csproj -c Release
      - run: dotnet test tests/WsaHelper.Desktop.Tests/WsaHelper.Desktop.Tests.csproj -c Release
      - run: dotnet build src/WsaHelper.Desktop/WsaHelper.Desktop.csproj -c Release
      - run: dotnet list src/WsaHelper.Desktop/WsaHelper.Desktop.csproj package --vulnerable --include-transitive
